# 运行时只维护Queue级令牌桶。单SSD的40 GB/s物理上限由SSD后端负责，
# 因此本文件既不创建Group令牌桶，也不创建重复的QoS Root令牌桶。
token_bucket:
  update_period_us: 80               # 所有有限令牌桶每80 us补充一次
  initial_state: empty               # CIR/PIR桶都从空开始，首次下发需要等待令牌补充
  queue_max_io_size_bytes: 147456    # QoS入口最大IO为144 KiB，用于给动态桶保留完整IO余量
  queue_cbs_bytes: 589824            # CIR最小突发容量为4个完整Block；高速率会自动扩容
  queue_pbs_bytes: 589824            # PIR最小突发容量；高速率会自动扩为“每周期补充+1个IO”

  # 这里的Group CIR只是组内Queue CIR的分配预算，不是运行时Group令牌桶。
  # IO能否通过QoS只检查对应Queue的CIR/PIR；Group仍供分层WRR使用。
  group_rates:
    - {group_id: g0, cir_gb_s: 1.28}
    - {group_id: g1, cir_gb_s: 1.92}
    - {group_id: g2, cir_gb_s: 2.56}
    - {group_id: g3, cir_gb_s: 3.20}
    - {group_id: g4, cir_gb_s: 3.84}
    - {group_id: g5, cir_gb_s: 5.12}
    - {group_id: g6, cir_gb_s: 6.40}
    - {group_id: g7, cir_gb_s: 7.68}

  # 每组32个Queue按[4,3,2,1]交错重复8次；权重总和为80。
  # Queue CIR = Group CIR × 本项权重 / 80，因而每组Queue CIR之和等于Group CIR。
  queue_cir_weight_bitmap:
    [4, 3, 2, 1, 4, 3, 2, 1,
     4, 3, 2, 1, 4, 3, 2, 1,
     4, 3, 2, 1, 4, 3, 2, 1,
     4, 3, 2, 1, 4, 3, 2, 1]

  # 默认关闭pir-uncapped。每个Queue的有限PIR等于单SSD物理峰值40 GB/s，
  # 因此单Queue仍可使用整盘能力，但不会绕过PIR令牌检查；多Queue聚合上限
  # 继续由SSD后端保证。DPU状态控制策略可以在运行时改成更小的有限PIR。
  queue_default_pir_gb_s: 40.0

  # 单Queue override可以同时覆盖PIR/PBS或CIR/CBS；未提供桶容量时使用上方默认值。
  # CIR override后，同组32个Queue的有效CIR总和仍应保持等于Group CIR。
  # 示例：q000: {pir_gb_s: 0.50, pbs_bytes: 589824}
  queue_overrides: {}
