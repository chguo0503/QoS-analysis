# ASU后端运行配置，只保留不能由其他字段直接推导的参数。
backend:
  media_mode: TLC                               # NAND介质模式；可填写TLC或SLC。
  chunk_size_bytes: 4096                        # 后端内部命令为4 KiB，与上层的模型KV block不是同一概念。

  fcp:
    atom_slots: 30                              # FCP最多保存30个8 KiB原子，等待、处理和阻塞完成都占槽。
    atom_rate_per_second: 6000000               # FCP每秒最多启动600万个8 KiB原子。
    latency_us: 5                               # 一个8 KiB原子从启动到处理完成固定需要5 us。

  bcp:
    input_queue_depth_commands: 1024            # BCP输入FIFO最多等待1024个4 KiB命令。
    max_inflight_commands: 20                   # BCP最多保存20个正在处理或完成后阻塞的命令。
    command_rate_per_second: 10000000           # BCP每秒最多启动1000万个4 KiB命令。
    latency_us: 2                               # 一个4 KiB命令从启动到处理完成固定需要2 us。

  nfi:
    command_slots: 10                           # NFI只有10个共享命令槽，等待、处理和阻塞完成都占槽。
    command_rate_per_second: 10000000           # NFI每秒最多启动1000万个4 KiB命令。
    latency_us: 1                               # 一个4 KiB命令在NFI中固定处理1 us。

  nand:
    command_slots: 512                          # NAND最多保存512个等待、读取中或完成后阻塞的4 KiB命令。
    read_bandwidth_bytes_per_second: 40000000000  # 整个NAND聚合读取带宽上限为40 GB/s。
    slc_latency_us: 23                          # SLC模式下一个4 KiB读取固定需要23 us。
    tlc_latency_us: 50                          # TLC模式下一个4 KiB读取固定需要50 us。

  bdp:
    command_slots: 20                           # BDP总共保存20个等待、处理或完成后阻塞的4 KiB命令。
    command_rate_per_second: 10000000           # BDP每秒最多启动1000万个4 KiB命令。
    latency_us: 2                               # 一个4 KiB命令在BDP中固定处理2 us。

  das:
    atom_slots: 18                              # DAS最多保存18个等待、DMA中或完成的8 KiB原子。
    atom_rate_per_second: 6000000               # DAS每秒最多启动600万个8 KiB原子。
    latency_us: 3                               # 一个8 KiB DMA原子从启动到完成固定需要3 us。
