layer_request:  # layer_request.py的全部可配置原始信息，运行时派生值不在此重复保存。

  # 模型：只描述模型结构和每层计算规模。
  model:  # 当前参与仿真的模型及其结构参数。
    name: "GLM-5.1"  # 模型名称，同时作为scenario.model_profiles的唯一键。
    profile:  # 当前模型的计算规模与层结构。
      active_parameters: 40_000_000_000  # 每个Token参与计算的激活参数总量，当前按400亿估算。
      hidden_layers: 78  # Transformer层总数，合法层索引为0到hidden_layers-1。
      kv_lora_rank: 512  # 每Token、每层保存的MLA KV潜变量维度。
      qk_rope_head_dim: 64  # 每Token、每层额外保存的RoPE维度。

  # GPU：只描述把重算操作量换算为计算窗口的硬件假设。
  gpu:  # 当前GPU设备及有效计算能力的仿真假设。
    device: "NVIDIA GeForce RTX 4090"  # GPU显示名称，当前只作为结果元数据。
    count: 1  # 参与当前Batch计算的GPU数量。
    memory_gb: 24  # 单卡标称显存容量，单位GB，当前不参与带宽公式。
    effective_compute_tflops: 100.0  # 本轮实验将原50 TFLOPS翻倍；单位TFLOPS，不是实机测量值。
    operation_factor_per_parameter_token: 2.0  # 每参数、每Token估算的浮点操作数。

  # KV Cache：只描述元素精度和逻辑block布局。
  kv_cache:  # KV Cache元素与逻辑block的存储布局。
    bits_per_element: 16  # 每个KV元素的位宽，当前按BF16估算。
    tokens_per_block: 128  # 一个逻辑KV block对齐容纳的Token数。

  # 工作负载：只描述LLM要运行的P节点请求，不放QoS或SSD配置。
  workload:  # 联合仿真使用的默认LLM工作负载。
    workload_id: "glm51_P0_all_layers"  # LLM内部聚合同一次推理全部层的编号。
    p_node_id: "P0"  # 发起请求的P节点；以后增加节点时依次使用P1、P2。
    model: "GLM-5.1"  # 当前工作负载使用的模型名称。
    first_layer_index: 0  # 要运行的第一层，包含该层。
    last_layer_index: 77  # 要运行的最后一层，包含该层。
    arrival_time_us: 0.0  # 这次推理进入仿真的时间，单位微秒。
    input_tokens: 10_000  # 每个Batch样本的输入Token数。
    batch_size: 1  # 当前推理的Batch Size。
    prefill_layer_hit_ratio: 0.99  # 每层KV Cache命中率，0.99表示99%的Token从SSD读取。
    placement:  # 当前GPU为本次工作负载选择KV存储目标的策略。
      strategy: random  # random表示每个Block从允许访问的SSD中稳定随机选择一个。
      allowed_storage_targets: all  # all会在装配时展开为simulation YAML创建的全部SSD。
      random_seed: 6102  # 与DPU Queue绑定种子独立，保证两类随机实验互不影响。
