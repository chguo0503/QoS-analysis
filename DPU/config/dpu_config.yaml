dpu:
  queue_binding:
    # 按GPU索引为每条GPU/SSD路径分配一条组间平衡的互斥Queue。
    strategy: balanced_exclusive

    # 比较入口会用完全相同的工作负载分别运行以下策略。
    comparison_strategies:
      - balanced_exclusive

  # DPU直接读取每个SSD前独立QoS的Queue IO数量，并向同一QoS写入CIR/PIR。
  # 该状态传递只观察IO进入/离开QoS Queue，不使用SSD完成通知。
  rate_control:
    enabled: true
    strategy: demand_aware_fcfs_cir
    # Queue CIR保证每条路径的需求，PIR保持uncapped以借用空闲带宽；
    # 过载时后到Demand获得剩余CIR或0，但所有非空Queue仍可走EXCESS。
    # 动态Group WRR接口保留，本策略不调用，Group/Queue权重由YAML固定。
